{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head><meta charset="utf-8">
        <link rel="stylesheet" href="{% static 'css/stijl.css' %}">
        <title>Mijn Website</title>
    </head>
    <body>
        <header>
            <h1>Mijn Website</h1>
        </header>
        {% block content %}{% for post in posts %}
        <article class="post">
            <time class="date">{{ post.published_date }}</time>
            <h2><a href="">{{ post.title }}</a></h2>
            <p>{{ post.text|linebreaksbr }}</p>
        </article>
        {% endfor %}
        {% endblock %}
        <footer>&copy;2026 VB</footer>
    </body>
</html>
